<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GrowthGram — Instagram Promotion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0b12;--bg-soft:#12121c;--card:#161624;--text:#f4f4f8;--muted:#a2a2b8;--line:rgba(255,255,255,.08);--grad:linear-gradient(135deg,#f9ce34,#ee2a7b 50%,#6228d7);--grad-soft:linear-gradient(135deg,rgba(249,206,52,.15),rgba(238,42,123,.15),rgba(98,40,215,.15));--radius:16px;--shadow:0 20px 60px rgba(0,0,0,.45);--green:#22c55e;--red:#ef4444}
  *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}a{color:inherit;text-decoration:none}button{font-family:inherit}.hidden{display:none!important}.container{width:min(1100px,92%);margin-inline:auto}
  .ig-logo{width:40px;height:40px;border-radius:12px;background:var(--grad);display:grid;place-items:center;box-shadow:0 8px 24px rgba(238,42,123,.35);position:relative;flex-shrink:0}.ig-logo::before{content:"";width:22px;height:22px;border:2.5px solid #fff;border-radius:7px;position:relative}.ig-logo::after{content:"";position:absolute;top:50%;left:50%;width:8px;height:8px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%)}.ig-dot{position:absolute;top:8px;right:8px;width:4px;height:4px;background:#fff;border-radius:50%}
  .logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:1.22rem;justify-content:center;letter-spacing:-.3px}.logo span.brand-text{background:linear-gradient(180deg,#fff,#c9c9d6);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 26px;border-radius:12px;font-weight:700;font-size:.95rem;cursor:pointer;border:none;transition:transform .2s,opacity .2s;font-family:inherit;width:100%}.btn:hover{transform:translateY(-2px)}.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}.btn-primary{background:var(--grad);color:#fff;box-shadow:0 10px 30px rgba(238,42,123,.35)}
  .form-group{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}.form-group label{font-size:.82rem;font-weight:600;color:var(--muted)}.form-group input,.form-group select{width:100%;padding:13px 15px;border-radius:11px;border:1px solid var(--line);background:#20202e;color:var(--text);font-family:inherit;font-size:.95rem;outline:none;transition:border-color .2s}.form-group input:focus,.form-group select:focus{border-color:rgba(238,42,123,.6)}.err{color:#fca5a5;font-size:.85rem;text-align:center;margin-top:10px;min-height:1.2em}
  .auth-screen{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;overflow:hidden}.auth-screen::before{content:"";position:absolute;top:-200px;right:-150px;width:500px;height:500px;background:radial-gradient(circle,rgba(238,42,123,.22),transparent 65%);filter:blur(40px)}.auth-screen::after{content:"";position:absolute;bottom:-200px;left:-150px;width:400px;height:400px;background:radial-gradient(circle,rgba(98,40,215,.22),transparent 65%);filter:blur(40px)}.auth-card{position:relative;z-index:1;width:min(440px,100%);background:var(--card);border:1px solid var(--line);border-radius:24px;padding:40px;box-shadow:var(--shadow)}.auth-card h1{text-align:center;font-size:1.55rem;font-weight:800;margin-bottom:6px;margin-top:20px;letter-spacing:-.5px}.auth-card .sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:26px}.tabs{display:flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:24px}.tab{flex:1;padding:10px;border-radius:9px;text-align:center;font-weight:600;font-size:.9rem;color:var(--muted);cursor:pointer;background:none;border:none;transition:all .2s;font-family:inherit}.tab.active{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(238,42,123,.3)}
  .dash{min-height:100vh;padding:0 0 60px}.dash-header{background:rgba(11,11,18,.8);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}.dash-header .wrap{width:min(1100px,92%);margin-inline:auto;display:flex;align-items:center;justify-content:space-between;height:66px}.dash-header .logo{justify-content:flex-start;font-size:1.08rem}.dash-header .ig-logo{width:34px;height:34px;border-radius:10px}.dash-header .ig-logo::before{width:18px;height:18px;border-width:2px;border-radius:6px}.dash-header .ig-logo::after{width:6px;height:6px;border-width:1.8px}.dash-header .ig-dot{top:7px;right:7px;width:3.5px;height:3.5px}.user-chip{display:flex;align-items:center;gap:10px}.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:800;font-size:.85rem}.user-name{font-size:.85rem;font-weight:600;display:none}@media(min-width:640px){.user-name{display:block}}.logout-btn{background:none;border:1px solid var(--line);color:var(--muted);padding:7px 14px;border-radius:9px;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}.logout-btn:hover{background:rgba(239,68,68,.15);color:#fca5a5;border-color:rgba(239,68,68,.3)}
  .dash-hero{text-align:center;padding:44px 0 34px}.dash-hero h1{font-size:clamp(1.6rem,3.6vw,2.2rem);font-weight:900;letter-spacing:-.5px;margin-bottom:8px}.dash-hero p{color:var(--muted);font-size:.95rem}.order-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px;max-width:720px;margin:0 auto;box-shadow:var(--shadow)}.service-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:24px}.service-opt{position:relative}.service-opt input{position:absolute;opacity:0;pointer-events:none}.service-opt label{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 12px;border-radius:14px;background:rgba(255,255,255,.03);border:2px solid var(--line);cursor:pointer;transition:all .2s;text-align:center}.service-opt label .icon{font-size:1.6rem}.service-opt label .txt{font-weight:700;font-size:.85rem}.service-opt input:checked+label{background:var(--grad-soft);border-color:rgba(238,42,123,.6);box-shadow:0 8px 24px rgba(238,42,123,.2)}.service-opt label:hover{border-color:rgba(238,42,123,.4)}.row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:560px){.row-2{grid-template-columns:1fr}}.summary{background:rgba(255,255,255,.03);border:1px dashed var(--line);border-radius:12px;padding:16px;margin:6px 0 20px;font-size:.9rem;color:var(--muted)}.summary strong{color:var(--text)}
  .success-screen{min-height:100vh;display:grid;place-items:center;padding:24px}.success-card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:50px 36px;max-width:460px;text-align:center;box-shadow:var(--shadow)}.check-circle{width:96px;height:96px;border-radius:50%;background:rgba(34,197,94,.15);border:3px solid var(--green);display:grid;place-items:center;margin:0 auto 24px;animation:pop .5s ease}.check-circle svg{width:48px;height:48px;stroke:var(--green);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:draw .5s .25s ease forwards}@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.1)}100%{transform:scale(1)}}@keyframes draw{to{stroke-dashoffset:0}}.success-card h2{font-size:1.5rem;font-weight:800;margin-bottom:10px}.success-card p{color:var(--muted);font-size:.95rem;margin-bottom:26px}.order-id{display:inline-block;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:8px 16px;border-radius:9px;font-family:monospace;font-size:.85rem;margin-bottom:26px;color:#ffd6e8}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--card);border:1px solid var(--line);color:var(--text);padding:13px 22px;border-radius:12px;box-shadow:var(--shadow);font-size:.9rem;font-weight:600;opacity:0;transition:transform .3s,opacity .3s;z-index:200}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}@media(max-width:480px){.auth-card{padding:28px 22px}.order-card{padding:24px 18px}.dash-header .logo{font-size:.95rem}}
</style>
</head>
<body>
<div class="auth-screen" id="authScreen"><div class="auth-card">
  <div class="logo"><div class="ig-logo"><span class="ig-dot"></span></div><span class="brand-text">GrowthGram</span></div>
  <h1 id="authTitle">Create your account</h1><p class="sub" id="authSub">Start growing your Instagram today</p>
  <div class="tabs"><button type="button" class="tab active" id="tabSignup">Sign Up</button><button type="button" class="tab" id="tabLogin">Login</button></div>
  <form id="authForm">
    <div class="form-group" id="nameGroup"><label for="inName">Full Name</label><input type="text" id="inName" placeholder="Your name" autocomplete="name"/></div>
    <div class="form-group"><label for="inInsta">Instagram ID</label><input type="text" id="inInsta" placeholder="@your_username" required autocomplete="username"/></div>
    <div class="form-group" id="mobileGroup"><label for="inMobile">Mobile Number</label><input type="tel" id="inMobile" placeholder="10-digit mobile number" inputmode="numeric" maxlength="10"/></div>
    <div class="form-group"><label for="inPassword">Password</label><input type="password" id="inPassword" placeholder="Password (min 6 chars)" required autocomplete="current-password" minlength="6"/></div>
    <button type="submit" class="btn btn-primary" id="authBtn">Create Account →</button><p class="err" id="authErr" role="alert"></p>
  </form>
</div></div>
<div class="dash hidden" id="dashScreen"><header class="dash-header"><div class="wrap">
  <div class="logo"><div class="ig-logo"><span class="ig-dot"></span></div><span class="brand-text">GrowthGram</span></div>
  <div class="user-chip"><div class="user-avatar" id="userAvatar">U</div><span class="user-name" id="userName">User</span><button class="logout-btn" id="logoutBtn">Logout</button></div>
</div></header>
<div class="container"><div class="dash-hero"><h1>Place your order 🚀</h1><p>Choose what you need, set quantity, and we'll take care of the rest.</p></div>
<form class="order-card" id="orderForm">
  <div class="form-group" style="margin-bottom:10px"><label>Select Service</label></div>
  <div class="service-grid">
    <div class="service-opt"><input type="radio" name="service" id="sLikes" value="Likes" checked/><label for="sLikes"><span class="icon">❤️</span><span class="txt">Likes</span></label></div>
    <div class="service-opt"><input type="radio" name="service" id="sViews" value="Views"/><label for="sViews"><span class="icon">👁️</span><span class="txt">Views</span></label></div>
    <div class="service-opt"><input type="radio" name="service" id="sComments" value="Comments"/><label for="sComments"><span class="icon">💬</span><span class="txt">Comments</span></label></div>
    <div class="service-opt"><input type="radio" name="service" id="sFollowers" value="Followers"/><label for="sFollowers"><span class="icon">👥</span><span class="txt">Followers</span></label></div>
  </div>
  <div class="row-2"><div class="form-group"><label for="inQty">Quantity</label><select id="inQty" required><option value="">Select quantity</option><option value="100">100</option><option value="250">250</option><option value="500">500</option><option value="1000">1,000</option><option value="2500">2,500</option><option value="5000">5,000</option><option value="10000">10,000</option></select></div>
  <div class="form-group"><label for="inTarget">Instagram ID / Video Link</label><input type="text" id="inTarget" placeholder="@username or https://instagram.com/p/..." required/></div></div>
  <div class="summary" id="summary">You selected <strong>Likes</strong> for <strong>—</strong></div><button type="submit" class="btn btn-primary" id="orderBtn">Submit Order →</button><p class="err" id="orderErr" role="alert"></p>
</form></div></div>
<div class="success-screen hidden" id="successScreen"><div class="success-card"><div class="check-circle"><svg viewBox="0 0 52 52"><polyline points="14 27 22 35 38 19"/></svg></div><h2>Order Placed! 🎉</h2><p>Your order has been received. We'll start processing it shortly.</p><div class="order-id" id="orderId">#GG-000000</div><button class="btn btn-primary" id="newOrderBtn">Place Another Order</button></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,collection,addDoc,serverTimestamp,doc,setDoc,getDoc}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyCn0e4T3xdE5hQXECSpC7sQ2XyXRWOdFm0",authDomain:"instapro-18936.firebaseapp.com",projectId:"instapro-18936",storageBucket:"instapro-18936.firebasestorage.app",messagingSenderId:"680876789917",appId:"1:680876789917:web:4fe99fcefd29dcebf74474"};

const authScreen=document.getElementById('authScreen'),dashScreen=document.getElementById('dashScreen'),successScreen=document.getElementById('successScreen');
const authForm=document.getElementById('authForm'),authTitle=document.getElementById('authTitle'),authSub=document.getElementById('authSub'),authBtn=document.getElementById('authBtn'),authErr=document.getElementById('authErr');
const tabSignup=document.getElementById('tabSignup'),tabLogin=document.getElementById('tabLogin'),nameGroup=document.getElementById('nameGroup'),mobileGroup=document.getElementById('mobileGroup');
const inName=document.getElementById('inName'),inInsta=document.getElementById('inInsta'),inMobile=document.getElementById('inMobile'),inPassword=document.getElementById('inPassword');
const userName=document.getElementById('userName'),userAvatar=document.getElementById('userAvatar'),logoutBtn=document.getElementById('logoutBtn'),orderForm=document.getElementById('orderForm'),orderBtn=document.getElementById('orderBtn'),orderErr=document.getElementById('orderErr'),summary=document.getElementById('summary'),inQty=document.getElementById('inQty'),inTarget=document.getElementById('inTarget'),orderIdEl=document.getElementById('orderId'),newOrderBtn=document.getElementById('newOrderBtn'),toastEl=document.getElementById('toast');
let mode='signup',currentUserDoc=null,toastTimer;

const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);

function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2600)}
function setMode(next){mode=next;const signup=mode==='signup';tabSignup.classList.toggle('active',signup);tabLogin.classList.toggle('active',!signup);authTitle.textContent=signup?'Create your account':'Welcome back';authSub.textContent=signup?'Start growing your Instagram today':'Login to place your order';authBtn.textContent=signup?'Create Account →':'Login →';nameGroup.style.display=signup?'flex':'none';mobileGroup.style.display=signup?'flex':'none';inName.required=signup;inMobile.required=signup;inPassword.autocomplete=signup?'new-password':'current-password';authErr.textContent=''}
tabSignup.addEventListener('click',()=>setMode('signup'));tabLogin.addEventListener('click',()=>setMode('login'));
function friendlyAuthError(err){const map={'auth/email-already-in-use':'This Instagram ID is already registered. Please login.','auth/user-not-found':'No account found with this Instagram ID.','auth/wrong-password':'Incorrect password.','auth/invalid-credential':'Wrong Instagram ID or password.','auth/weak-password':'Password too weak. Use at least 6 characters.','auth/too-many-requests':'Too many attempts. Try again later.','auth/network-request-failed':'Network error. Check your internet connection.'};return map[err.code]||err.message||'Something went wrong.'}
authForm.addEventListener('submit',async e=>{e.preventDefault();authErr.textContent='';authBtn.disabled=true;authBtn.textContent='Please wait...';const insta=inInsta.value.trim().replace(/^@/,'');const password=inPassword.value;
try{if(!/^[a-zA-Z0-9._]{1,30}$/.test(insta))throw new Error('Enter a valid Instagram username.');if(mode==='signup'){if(!inName.value.trim())throw new Error('Please enter your name');if(!/^\d{10}$/.test(inMobile.value.trim()))throw new Error('Enter a valid 10-digit mobile number');if(password.length<6)throw new Error('Password must be at least 6 characters');const email=`${insta.toLowerCase()}@growthgram.user`;const cred=await createUserWithEmailAndPassword(auth,email,password);await setDoc(doc(db,'users',cred.user.uid),{name:inName.value.trim(),instagram:insta,mobile:inMobile.value.trim(),createdAt:serverTimestamp()})}else{await signInWithEmailAndPassword(auth,`${insta.toLowerCase()}@growthgram.user`,password)}}catch(err){authErr.textContent=friendlyAuthError(err)}finally{authBtn.disabled=false;authBtn.textContent=mode==='signup'?'Create Account →':'Login →'}});
onAuthStateChanged(auth,async user=>{if(user){try{const snap=await getDoc(doc(db,'users',user.uid));currentUserDoc=snap.exists()?snap.data():null;if(!currentUserDoc){authErr.textContent='User profile not found. Please contact support or sign up again.';await signOut(auth);return}userName.textContent=currentUserDoc.instagram||currentUserDoc.name||'User';userAvatar.textContent=(currentUserDoc.name||'U').charAt(0).toUpperCase()}catch(err){console.error(err);currentUserDoc=null;toast('Could not load profile. Check Firestore rules.');return}authScreen.classList.add('hidden');successScreen.classList.add('hidden');dashScreen.classList.remove('hidden');updateSummary()}else{currentUserDoc=null;authScreen.classList.remove('hidden');dashScreen.classList.add('hidden');successScreen.classList.add('hidden');authForm.reset()}});
logoutBtn.addEventListener('click',async()=>{try{await signOut(auth)}catch(err){toast('Could not log out')}});
function getSelectedService(){return document.querySelector('input[name="service"]:checked')?.value||'—'}
function updateSummary(){summary.innerHTML=`You selected <strong>${getSelectedService()}</strong> for <strong>${inQty.value||'—'}</strong>`}
document.querySelectorAll('input[name="service"]').forEach(el=>el.addEventListener('change',updateSummary));inQty.addEventListener('change',updateSummary);
orderForm.addEventListener('submit',async e=>{e.preventDefault();orderErr.textContent='';if(!auth.currentUser){orderErr.textContent='You must be logged in.';return}if(!currentUserDoc){orderErr.textContent='Your profile is not loaded. Please reload and try again.';return}if(!inQty.value){orderErr.textContent='Please select quantity.';return}if(!inTarget.value.trim()){orderErr.textContent='Please enter Instagram ID or video link.';return}orderBtn.disabled=true;orderBtn.textContent='Submitting...';
try{const target=inTarget.value.trim();if(target.length>500)throw new Error('Target must be 500 characters or fewer.');const orderData={userId:auth.currentUser.uid,userName:currentUserDoc.name||'',instagram:currentUserDoc.instagram||'',mobile:currentUserDoc.mobile||'',service:getSelectedService(),quantity:Number(inQty.value),target,status:'pending',createdAt:serverTimestamp()};const docRef=await addDoc(collection(db,'orders'),orderData);orderIdEl.textContent='#GG-'+docRef.id.slice(-6).toUpperCase();dashScreen.classList.add('hidden');successScreen.classList.remove('hidden');orderForm.reset();document.getElementById('sLikes').checked=true;updateSummary()}catch(err){console.error(err);orderErr.textContent=err.message||'Could not submit. Please try again.'}finally{orderBtn.disabled=false;orderBtn.textContent='Submit Order →'}});
newOrderBtn.addEventListener('click',()=>{successScreen.classList.add('hidden');dashScreen.classList.remove('hidden')});setMode('signup');updateSummary();
</script>
</body>
</html>
